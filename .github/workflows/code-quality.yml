name: Tests and Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-quality-security:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      OXIGRAPH_BASE_DIR: /tmp/petscan-oxigraph
      COVERAGE_FAIL_UNDER: "60"
      PERFORMANCE_BASELINE_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.in
            constraints.txt
            constraints-dev.in
            constraints-dev.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r constraints-dev.txt

      - name: Verify dependency constraints
        run: |
          pip-compile --resolver=backtracking --strip-extras --allow-unsafe --generate-hashes --no-emit-index-url \
            --output-file=constraints-dev.txt constraints-dev.in
          pip-compile --resolver=backtracking --strip-extras --allow-unsafe --generate-hashes --no-emit-index-url \
            --output-file=constraints.txt constraints.in
          git diff --exit-code -- constraints-dev.txt constraints.txt

      - name: Run tests + lint + type-check + security scans
        run: ./scripts/run_tests.sh
